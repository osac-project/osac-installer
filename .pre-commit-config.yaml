exclude: 'charts/.*'
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: trailing-whitespace
    - id: check-merge-conflict
    - id: end-of-file-fixer
    - id: check-added-large-files
    - id: check-case-conflict
    - id: check-json
    - id: check-symlinks
    - id: detect-private-key

- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
    # Upstream entry is `--staged` (commit-time only). `pre-commit run --all-files`
    # and CI pre-commit/action leave the index empty, so this hook is a no-op there.
    # CI secret scanning is the dedicated docker step in pre-commit.yaml (SKIP'd below
    # via the workflow). Locally: rely on `git commit` / stage then `pre-commit run gitleaks`.
    - id: gitleaks

- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.35.1
  hooks:
    - id: yamllint
      files: \.(yaml|yml)$
      types: [file, yaml]
      entry: yamllint --strict
