{{- if and .Values.trustManager.enabled .Values.caIssuer.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osac-prereqs-wait-trust-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-prereqs.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: osac-prereqs-wait-trust-manager
  labels:
    {{- include "osac-prereqs.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "5"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["trust.cert-manager.io"]
    resources: ["bundles"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osac-prereqs-wait-trust-manager
  labels:
    {{- include "osac-prereqs.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: osac-prereqs-wait-trust-manager
subjects:
  - kind: ServiceAccount
    name: osac-prereqs-wait-trust-manager
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: osac-prereqs-wait-trust-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-prereqs.hookLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "5"
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "osac-prereqs.hookLabels" . | nindent 8 }}
    spec:
      serviceAccountName: osac-prereqs-wait-trust-manager
      restartPolicy: OnFailure
      volumes:
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: osac-prereqs-hook-scripts
      containers:
        - name: wait-trust-manager
          image: {{ .Values.cliImage }}
          env:
            - name: HOME
              value: /tmp
            - name: OSAC_NAMESPACE
              value: {{ .Values.osacNamespace }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          command:
            - /bin/bash
            - /scripts/wait-trust-manager.sh
{{- end }}
